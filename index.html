<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 Multi Key Generator</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
        font-family:system-ui,sans-serif;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }
    .card{
        max-width:900px;
        width:100%;
        background:rgba(15,15,25,0.75);
        backdrop-filter:blur(16px);
        border-radius:32px;
        padding:28px;
        border:1px solid rgba(255,255,255,0.08);
    }
    h1{font-size:28px;background:linear-gradient(135deg,#fff,#c7e9fb,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .sub{color:rgba(255,255,255,0.45);font-size:13px;margin:6px 0 24px;}
    textarea{
        width:100%;padding:16px;background:rgba(0,0,0,0.4);
        border:1.5px solid rgba(255,255,255,0.08);border-radius:20px;
        color:white;font-family:monospace;font-size:13px;resize:vertical;
    }
    textarea:focus{outline:none;border-color:#8b5cf6;}
    .btn-group{display:flex;gap:12px;margin:20px 0 18px;flex-wrap:wrap;}
    button{
        padding:10px 22px;border:none;border-radius:44px;font-weight:500;
        cursor:pointer;font-size:13px;background:rgba(255,255,255,0.08);color:white;
    }
    .btn-primary{background:linear-gradient(135deg,#8b5cf6,#7c3aed);}
    .btn-secondary{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);}
    .btn-danger{background:rgba(239,68,68,0.2);color:#fecaca;}
    .stats{display:flex;gap:20px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06);}
    .stat{font-size:12px;color:rgba(255,255,255,0.5);}
    .stat-number{color:#f0f0f0;font-weight:600;font-size:16px;margin-left:6px;}
    .result-area{max-height:400px;overflow-y:auto;}
    .result-item{
        background:rgba(0,0,0,0.25);border-radius:18px;padding:14px;margin-bottom:10px;
        border:1px solid rgba(255,255,255,0.04);
    }
    .key{font-weight:500;font-size:13px;color:#e0e7ff;word-break:break-all;}
    .link{font-size:11px;font-family:monospace;background:rgba(0,0,0,0.4);padding:8px;border-radius:14px;margin:8px 0;color:rgba(255,255,255,0.65);word-break:break-all;}
    .copy-single{background:rgba(139,92,246,0.25);padding:5px 12px;font-size:11px;border-radius:40px;}
    .toast{
        position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
        background:#1f1f2e;backdrop-filter:blur(20px);color:white;
        padding:10px 22px;border-radius:60px;font-size:13px;z-index:1000;
        animation:fadeUp 0.25s ease;border:1px solid rgba(255,255,255,0.1);
    }
    @keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
</head>
<body>
<div class="card">
    <h1>🔑 Multi Key Generator</h1>
    <div class="sub">ใส่คีย์ทีละบรรทัด → สร้าง → คัดลอก (เว้น 1 บรรทัดว่าง)</div>
    
    <textarea id="keysInput" rows="6" placeholder="CRX-CFD048-CC9202&#10;CRX-BC479D-0FB074"></textarea>
    
    <div class="btn-group">
        <button class="btn-primary" id="genBtn">✨ สร้างลิงก์</button>
        <button class="btn-secondary" id="copyAllBtn" style="display:none;">📋 คัดลอกทั้งหมด</button>
        <button class="btn-danger" id="clearBtn">🗑️ ล้าง</button>
    </div>
    
    <div class="stats" id="statsArea" style="display:none;">
        <div class="stat">🔗 ทั้งหมด <span class="stat-number" id="totalCount">0</span></div>
        <div class="stat">📋 ไม่ซ้ำ <span class="stat-number" id="uniqueCount">0</span></div>
    </div>
    
    <div id="result" class="result-area"></div>
</div>

<script>
// ========== เปลี่ยนแค่นี้ ==========
const BASE_URL = "https://magenta-pony-daea85.netlify.app/?key=";
// =================================

let currentKeys = [];

function showMessage(msg) {
    let toast = document.querySelector(".toast");
    if (toast) toast.remove();
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
}

function generate() {
    const raw = document.getElementById("keysInput").value;
    if (!raw.trim()) {
        showMessage("❌ ใส่คีย์ก่อน");
        return;
    }
    
    const keys = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
    if (keys.length === 0) {
        showMessage("❌ ไม่มีคีย์");
        return;
    }
    
    currentKeys = [...keys];
    const uniqueCount = new Set(currentKeys).size;
    
    const container = document.getElementById("result");
    container.innerHTML = "";
    
    currentKeys.forEach((key, idx) => {
        const link = BASE_URL + encodeURIComponent(key);
        const div = document.createElement("div");
        div.className = "result-item";
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                <span class="key">🔑 ${escapeHtml(key)}</span>
                <span style="background:rgba(139,92,246,0.2);padding:2px 8px;border-radius:30px;font-size:10px;">#${idx+1}</span>
            </div>
            <div class="link">🔗 ${escapeHtml(link)}</div>
            <button class="copy-single" data-link="${escapeHtml(link).replace(/'/g, "\\'")}">📋 คัดลอก</button>
        `;
        container.appendChild(div);
    });
    
    document.querySelectorAll(".copy-single").forEach(btn => {
        btn.addEventListener("click", (e) => {
            const link = btn.getAttribute("data-link");
            navigator.clipboard.writeText(link);
            showMessage("✅ คัดลอกแล้ว");
        });
    });
    
    document.getElementById("copyAllBtn").style.display = "inline-flex";
    document.getElementById("statsArea").style.display = "flex";
    document.getElementById("totalCount").innerText = currentKeys.length;
    document.getElementById("uniqueCount").innerText = uniqueCount;
    showMessage(`✨ สร้าง ${currentKeys.length} ลิงก์`);
}

function copyAllLinks() {
    if (currentKeys.length === 0) {
        showMessage("❌ ไม่มีลิงก์");
        return;
    }
    
    let result = "";
    for (let i = 0; i < currentKeys.length; i++) {
        result += BASE_URL + encodeURIComponent(currentKeys[i]);
        if (i !== currentKeys.length - 1) {
            result += "\n\n";
        }
    }
    
    const textarea = document.createElement("textarea");
    textarea.value = result;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
    
    showMessage(`📋 คัดลอก ${currentKeys.length} ลิงก์ (เว้น 1 บรรทัดว่าง)`);
}

function clearAll() {
    if (confirm("ล้างทั้งหมด?")) {
        document.getElementById("keysInput").value = "";
        document.getElementById("result").innerHTML = "";
        document.getElementById("copyAllBtn").style.display = "none";
        document.getElementById("statsArea").style.display = "none";
        currentKeys = [];
        showMessage("🗑️ ล้างแล้ว");
    }
}

function escapeHtml(str) {
    return str.replace(/[&<>]/g, (m) => {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

document.getElementById("keysInput").addEventListener("input", () => {
    const val = document.getElementById("keysInput").value;
    if (val.trim()) localStorage.setItem("savedKeys", val);
    else localStorage.removeItem("savedKeys");
});

const saved = localStorage.getItem("savedKeys");
if (saved) document.getElementById("keysInput").value = saved;

document.getElementById("genBtn").addEventListener("click", generate);
document.getElementById("copyAllBtn").addEventListener("click", copyAllLinks);
document.getElementById("clearBtn").addEventListener("click", clearAll);

document.getElementById("keysInput").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        generate();
    }
});
</script>
</body>
</html>
